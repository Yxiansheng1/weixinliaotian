# ============================================
#  微信陪聊机器人配置
#  改完不用重启微信，但要重启本程序（Ctrl+C 再 python run.py）
# ============================================

# dry_run = 只打印不发送（先用这个试）
# live    = 真的发到微信
mode: live

listen:
  # 只回这些人。必须和微信里的昵称一字不差。
  # 写法：
  #   contacts:
  #     - 张三
  #     - 李四
  # 留空的话程序会拒绝启动——故意这样，防止误回所有人。
  contacts:
    - 血小板NaYo

  # 群聊：只在有人 @ 你 时回复。群名要和微信里一致。
  groups: []
  at_me_only_in_group: true
  poll_interval: 1.5      # 多久查一次新消息（秒），别设太小

# 角色卡，改这个文件就换了个人
persona: personas/default.md

llm:
  provider: relay              # 官方直连 / 中转站都行，走 OpenAI 兼容协议
  base_url: https://www.tokenav.ai/v1
  model: deepseek-v4-pro       # 中转站的模型名可能和官方不同，用 probe.py --models 查
                               # 这个中转只有：deepseek-flash / deepseek-v4-pro
                               #              deepseek-v4.1-flash / deepseek-v4.1-flash-1017
                               # 想省钱换 v4.1-flash，想更细换 v4-pro
  temperature: 1.1
  max_tokens: 3000
  # 这个模型带"思考"：会先内部推理再回答。max_tokens 必须留够，
  # 否则推理把额度吃光，正文被截断甚至返回空——表现就是说话没脑子、上句不接下句。
  # none=不思考（最快最省）、low/medium/high=思考程度
  reasoning_effort: high
  api_key_env: DEEPSEEK_API_KEY   # 去 .env 里填这个变量
  timeout: 120
  penalties: true              # 个别中转站不接受这两个参数，报 400 就设成 false

humanize:
  read_delay: [0.6, 1.8]      # 收到后先"看一眼"的秒数
  chars_per_second: 3.2       # 打字速度，越小回得越慢
  min_typing: 0.8
  max_typing: 7.0
  split_long_reply: true      # 长回复拆成几条发，更像真人
  max_bubble_chars: 55        # 每条最多多少字
  max_bubbles: 3              # 一条回复最多拆成几条（超出的并进最后一条，不丢字）
  bubble_gap: [0.7, 1.8]      # 两条之间的停顿
  reply_probability: 1.0      # 0.9 = 有一成概率装没看见
  quiet_hours: []             # 例如 ["01:00", "07:30"]
  allow_actions: false        # 允许 (括号旁白) 这种角色扮演写法

memory:
  max_turns: 40      # 每次喂给模型的历史轮数
  summarize_after: 100 # 超过多少条就压成摘要，防止人设崩坏

log_level: INFO
